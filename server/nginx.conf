# ─────────────────────────────────────────────────────
# Upstream definitions (internal service routing)
# ─────────────────────────────────────────────────────

# Frontend static files (nginx serving HTML/CSS/JS)
upstream frontend_upstream {
  server frontend:80;          # Container name + port
  keepalive 32;                # Keep 32 idle connections for performance
}

# Backend Node.js/Express API + Socket.IO
upstream backend_upstream {
  server backend:3000;         # Container name + port
  keepalive 32;
}

# ─────────────────────────────────────────────────────
# HTTP Server (Port 80) - YOUR ORIGINAL CONFIG (UNCHANGED)
# ─────────────────────────────────────────────────────
server {
  listen 80;                   # Listen on port 80 (HTTP)
  server_name _;               # Match any hostname

  client_max_body_size 10M;    # Allow file uploads up to 10MB

  # Serve static frontend files
  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;       # Disable buffering for real-time apps
    proxy_cache off;           # Disable caching for dynamic content
  }

  # WebSocket proxy for Socket.IO (real-time chat)
  location /socket.io/ {
    proxy_pass http://backend_upstream/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;        # Required for WebSocket
    proxy_set_header Connection "Upgrade";         # Required for WebSocket
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;   # Long timeout for persistent connections
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  # Optional: REST API path (if you add one later)
  location /api/ {
    proxy_pass http://backend_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Health check endpoint for Docker/orchestrators
  location /health {
    access_log off;            # Don't log health checks (reduces noise)
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}

# ─────────────────────────────────────────────────────
# HTTPS Server (Port 443) - APPENDED (Does NOT modify above)
# ─────────────────────────────────────────────────────
server {
  listen 443 ssl;              # Listen on port 443 (HTTPS)
  server_name _;

  # SSL/TLS certificate paths (mounted from host via Docker)
  ssl_certificate     /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;

  # Secure TLS settings (compatible with modern browsers)
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  client_max_body_size 10M;

  # Same proxy rules as HTTP (copied for HTTPS)
  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;  # Critical: tells backend it's HTTPS
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
  }

  location /socket.io/ {
    proxy_pass http://backend_upstream/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass http://backend_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}